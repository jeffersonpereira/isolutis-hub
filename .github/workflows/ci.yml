name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: hub_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 3s --health-retries 20
    env:
      HUB_DATABASE_URL: postgresql+psycopg://hub:hub@localhost:5432/hub_test
      HUB_AMBIENTE: teste
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Testes do schema (SQL puro)
        run: PGPASSWORD=hub psql -h localhost -U hub -d postgres -c 'create database hub_sql' && PGPASSWORD=hub psql -h localhost -U hub -d hub_sql -v ON_ERROR_STOP=1 -f tests_sql/test_schema.sql

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
