<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hub Comercial iSolutis</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DKlQ-8KT.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DC3KCmf2.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span id="logoSide"><img alt="iSolutis" width="172" height="66" src="/logo-horizontal.png"></span><small>Hub Comercial</small></div>
    <nav id="nav" aria-label="Áreas do Hub Comercial"></nav>
    <div class="online" id="online" hidden aria-live="polite"></div>
    <div class="sync" id="sync"><span class="dot"></span>Conectando…</div>
    <div class="conta" id="conta" hidden><span id="contaEmail"></span><select id="empresaAtiva" aria-label="Empresa ativa" hidden></select><div class="conta-b"><button type="button" id="trocarSenha">Trocar senha</button><button type="button" id="sair">Sair</button></div></div>
  </aside>
  <main id="view"></main>
</div>
<div id="layer"></div>

<div class="login" id="login" hidden>
  <div class="lg-box">
    <div class="lg-topo"><img id="lgLogo" src="/logo-horizontal.png" alt="iSolutis" width="200" height="77"><span>Hub Comercial</span></div>
    <form id="lgEntrar" class="lg-form" novalidate>
      <h1>Entrar</h1>
      <label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" required>
      <label for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="lgBotao">Entrar</button>
      <p class="sub" style="margin:8px 0 0;text-align:center">Esqueceu a senha? Peça a um administrador do Hub para definir uma nova.</p>
    </form>
    <form id="lgNova" class="lg-form" novalidate hidden>
      <h1>Trocar senha</h1>
      <p class="sub" style="margin:0">Use pelo menos 8 caracteres. É com ela que você vai entrar no Hub.</p>
      <label for="lgAtual">Senha atual</label><input id="lgAtual" type="password" autocomplete="current-password" required>
      <label for="lgNova1">Nova senha</label><input id="lgNova1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="lgNova2">Repita a senha</label><input id="lgNova2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn primary" type="submit">Salvar senha</button>
      <button class="lg-link" type="button" id="lgCancelar">Cancelar</button>
    </form>
    <p class="lg-msg" id="lgMsg" role="status"></p>
  </div>
</div>
</body>
</html>
