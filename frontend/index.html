<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hub Comercial iSolutis</title>
<link rel="icon" type="image/png" href="/logo.png">
<script>
/* Tema antes da primeira pintura (a lógica completa está em src/ui/tema.ts). */
try{var p=localStorage.getItem("hub.tema");document.documentElement.setAttribute("data-theme",p==="escuro"||(p!=="claro"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")}catch(e){}
</script>
</head>
<body>
<a class="pular" href="#view">Pular para o conteúdo</a>
<div class="app" id="app">
  <aside id="side" aria-label="Menu lateral">
    <div class="brand"><span id="logoSide"><img alt="iSolutis" width="172" height="66" src="/logo-horizontal.png"><img class="marca-min" alt="iSolutis" width="36" height="36" src="/logo.png"></span><small>Hub Comercial</small></div>
    <nav id="nav" aria-label="Áreas do Hub Comercial"></nav>
    <div class="rodape">
      <div class="online" id="online" hidden aria-live="polite"></div>
      <div class="sync" id="sync"><span class="dot"></span><span class="tx">Conectando…</span></div>
      <button type="button" class="recolher" id="recolher" aria-label="Recolher a barra lateral" title="Recolher a barra lateral"></button>
    </div>
  </aside>
  <div class="area">
    <header class="topbar" role="banner">
      <button type="button" class="ib so-celular" id="abrirMenu" aria-label="Abrir menu" aria-controls="side" aria-expanded="false"></button>
      <div class="titulo-tela" id="tituloTela"></div>
      <div class="espaco"></div>
      <button type="button" class="cmdk" id="abrirPaleta" aria-label="Abrir a paleta de comandos (Ctrl K)" aria-haspopup="dialog"></button>
      <button type="button" class="btn primary novo" id="btnNovo" aria-haspopup="menu" aria-expanded="false"></button>
      <button type="button" class="ib" id="btnTema" aria-haspopup="menu" aria-expanded="false"></button>
      <button type="button" class="me" id="btnMe" aria-haspopup="menu" aria-expanded="false" aria-label="Menu do usuário" hidden></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="layer"></div>

<div class="login" id="login" hidden>
  <div class="lg-box">
    <div class="lg-topo"><img id="lgLogo" src="/logo-horizontal.png" alt="iSolutis" width="200" height="77"><span>Hub Comercial</span></div>
    <form id="lgEntrar" class="lg-form" novalidate>
      <h1>Entrar</h1>
      <label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" required>
      <label for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="lgBotao">Entrar</button>
      <p class="sub" style="margin:8px 0 0;text-align:center">Esqueceu a senha? Peça a um administrador do Hub para definir uma nova.</p>
    </form>
    <form id="lgNova" class="lg-form" novalidate hidden>
      <h1>Trocar senha</h1>
      <p class="sub" style="margin:0">Use pelo menos 8 caracteres. É com ela que você vai entrar no Hub.</p>
      <label for="lgAtual">Senha atual</label><input id="lgAtual" type="password" autocomplete="current-password" required>
      <label for="lgNova1">Nova senha</label><input id="lgNova1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="lgNova2">Repita a senha</label><input id="lgNova2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn primary" type="submit">Salvar senha</button>
      <button class="lg-link" type="button" id="lgCancelar">Cancelar</button>
    </form>
    <p class="lg-msg" id="lgMsg" role="status"></p>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
