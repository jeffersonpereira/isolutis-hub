<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamentos vencendo hoje</title>
</head>
<body style="margin:0;padding:0;background-color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#111827">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;padding:32px 16px">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)">

          <!-- Header -->
          <tr>
            <td style="background-color:#1d4ed8;padding:24px 32px">
              <p style="margin:0;font-size:20px;font-weight:700;color:#ffffff">iSolutis Hub</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px">
              <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#111827">
                Lançamentos vencendo hoje
              </h1>
              <p style="margin:0 0 24px;font-size:14px;color:#6b7280">
                {{total}} lançamento(s) vencem hoje e ainda não foram marcados como recebidos.
              </p>

              <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden">
                <thead>
                  <tr style="background-color:#f3f4f6">
                    <th style="padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em">Descrição</th>
                    <th style="padding:10px 12px;text-align:right;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em">Valor</th>
                  </tr>
                </thead>
                <tbody>
                  {{itens}}
                </tbody>
              </table>

              <p style="margin:24px 0 0;font-size:14px;color:#6b7280">
                Acesse o <strong>iSolutis Hub</strong> para atualizar o status dos lançamentos.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f9fafb;padding:16px 32px;border-top:1px solid #e5e7eb">
              <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center">
                Este é um e-mail automático do iSolutis Hub. Não responda a este e-mail.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
